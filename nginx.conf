# Web estática (Astro, build.format = 'file') detrás del proxy de Coolify (Traefik).
server_tokens off;

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tras el proxy, nginx ve http; las redirecciones deben ser relativas.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/javascript
               text/javascript application/json application/manifest+json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~ /\. { deny all; }

    # Assets con hash: cache larga
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # Fuentes e imágenes de public/: cache de una semana
    location ~* \.(png|jpe?g|gif|svg|ico|webp|avif|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # Quitar la barra final (la canónica no la lleva)
    location ~ ^(.+)/$ {
        return 301 $1;
    }

    # El HTML no se cachea: apunta siempre a los assets del último deploy
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
