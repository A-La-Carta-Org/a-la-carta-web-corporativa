# Integración continua: comprueba tipos, lint, build y enlaces en cada push y PR.
# No despliega nada: el despliegue lo hace Coolify a partir de la rama main (docs/DESPLIEGUE.md).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm run check:links
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
